name: daily

services:
  daily-ui:
    build: .
    container_name: daily-ui
    restart: unless-stopped
    networks: [edge]
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/']
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

networks:
  edge:
    external: true
